; goro config for RG35XX Plus (fbdev build)
[window]
title = goro

[render]
; fbdev renders in software; keep vsync off so the CPU paces the frames
vsync = false

[audio]
; oto needs ALSA on the device; start silent for the first bring-up,
; then flip to false once the rest works
noaudio = true

[gameplay]
noctrl = true

[log]
; the launcher also mirrors everything to GorORG35-logfile.txt; the file
; sink survives even when the app is launched without the new script
level = debug
file = goro.log
