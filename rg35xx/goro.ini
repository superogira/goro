; goro config for RG35XX Plus (fbdev build)
[window]
title = goro

[render]
; fbdev renders in software; keep vsync off so the CPU paces the frames
vsync = false

; Boot-time self update: fetch version.txt + the goro binary from this URL
; when the advertised build differs from the running one, then re-exec.
update_enabled = true
update_url = http://ro.catgg.net/webro
; FPS counter, bottom-right corner
fps = true

[ui]
; small-screen layout mode: the permanent HUD (basic info + menu, minimap,
; shortcut bar) stays hidden while a handheld layout is designed. The chat
; console runs in compact-auto form: small, shows on new messages, hides
; itself after a quiet spell.
hidehud = true

[login]
; auto-login straight into the world for device testing.
; charslot = 0..8 picks the character after login (tester sits in slot 0).
username = test
password = test
autologin = true
charslot = 0

[packet]
; client_date picks packet layouts per protocol era. The 20080910 default
; connects fine but its map heartbeat (0x0089) gets no reply from modern
; rAthena, which drops the link ~20s after entering a map. If the log shows
; "sent map tick opcode=0x0089" followed by a read timeout, try the date
; matching your server's packetver (20180307+ uses tick 0x0360), e.g.:
; client_date = 20211103

[audio]
; backend: auto = external player (mpv, then aplay) on this device — the
; in-process oto driver reports a working context but never opens a PCM
; stream here, so audio is silent. Set "oto" to use the in-process driver
; (e.g. on a PC build), or "mpv"/"aplay" to force one.
backend = auto
bgm = true
noaudio = false
bgmvolume = 0.6
sfxvolume = 0.8

[network]
; Ask this resolver directly (UDP 53) before the system one — the device's
; local DNS chain (systemd-resolved -> ISP) NXDOMAINs DDNS hostnames.
; Falls back to the system resolver automatically if 8.8.8.8 is unreachable.
dns = 8.8.8.8

[gameplay]
noctrl = true

[log]
; info keeps goro.log small: debug prints a "slow frame" line nearly every
; frame on this device (30 lines/s → megabytes per session). Switch back to
; debug only when hunting a specific problem; the map heartbeat stays
; visible at info either way.
level = info
file = goro.log
