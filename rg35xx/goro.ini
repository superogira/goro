; goro config for RG35XX Plus (fbdev build)
[window]
title = goro

[render]
; fbdev renders in software; keep vsync off so the CPU paces the frames
vsync = false

[login]
; auto-login straight into the world for device testing.
; charslot = 0..8 picks the character after login (tester sits in slot 0).
username = test
password = test
autologin = true
charslot = 0

[audio]
; oto v3 picks its own linux backend and fails soft (warn + silent) when
; none works — the log shows which backend it tried.
bgm = true
noaudio = false
bgmvolume = 0.6
sfxvolume = 0.8

[gameplay]
noctrl = true

[log]
; the launcher also mirrors everything to GorORG35-logfile.txt; the file
; sink survives even when the app is launched without the new script
level = debug
file = goro.log
